name: Security Audit

on:
  push:
    branches: ["main", "securite/**"]
  pull_request:
    branches: ["main"]
  schedule:
    # Scan hebdomadaire chaque lundi à 8h UTC
    - cron: "0 8 * * 1"

jobs:
  audit-backend:
    name: npm audit — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --omit=dev
      - name: Audit (aucune vuln. critique ou haute tolérée)
        run: npm audit --audit-level=high

  audit-frontend:
    name: npm audit — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfs-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pfs-frontend/package-lock.json

      - run: npm ci
      - name: Audit (aucune vuln. critique tolérée en prod)
        # Les vulnérabilités Vite/esbuild sont dans les devDeps (dev server uniquement).
        # On audite uniquement les dépendances de production.
        run: npm audit --omit=dev --audit-level=critical
